# nginx site configuration for llama.cpp-svelte-ui
#
# Serves the static Web UI installed by the llama.cpp-svelte-ui package
# and proxies API requests to the llama.cpp server (llama-server).
#
# Enable with:
#   ln -s /etc/nginx/sites-available/llama.cpp-svelte-ui.conf \
#         /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# If the llama.cpp server does not listen on 127.0.0.1:8080, change the
# address in the upstream block below.

upstream llama_cpp_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/llama.cpp-svelte-ui;
    index index.html;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # llama.cpp server API routes
    # (see tools/ui/src/lib/constants/api-endpoints.constants.ts)
    location /v1/ {
        proxy_pass http://llama_cpp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE streams (chat completions, model load/unload)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location /models {
        proxy_pass http://llama_cpp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        client_max_body_size 128m;
    }

    location /slots {
        proxy_pass http://llama_cpp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /tools {
        proxy_pass http://llama_cpp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /cors-proxy {
        proxy_pass http://llama_cpp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    # static UI (adapter-static, hash router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
